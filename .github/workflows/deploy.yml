name: Deploy Restaurant App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REGION:     ap-southeast-2
      STACK_NAME: restaurant-app

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS credentials ───────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-2

      # ── 3. Python 3.12 ──────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. SAM CLI ──────────────────────────────────────────────────────
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 5. SAM build ────────────────────────────────────────────────────
      - name: SAM Build
        run: sam build --template infra/template.yaml

      # ── 6. SAM package  (produces packaged.yaml with S3 URIs) ───────────
      # We package separately so we can pass the output template directly to
      # `aws cloudformation deploy`, which has a proper --capabilities flag
      # that cannot be overridden by samconfig.toml.
      - name: SAM Package
        run: |
          sam package \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --s3-prefix restaurant-app \
            --region ${{ env.REGION }} \
            --output-template-file packaged.yaml

      # ── 7. CloudFormation deploy ────────────────────────────────────────
      - name: CloudFormation Deploy
        run: |
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ env.REGION }} \
            --no-fail-on-empty-changeset

      # ── 8. Read stack outputs ────────────────────────────────────────────
      - name: Read CloudFormation outputs
        id: cfn
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.REGION }} \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          IMAGE_URL=$(get_output ImageUrl)
          SUMMARY_URL=$(get_output SummaryUrl)
          BUCKET_NAME=$(get_output BucketName)
          WEBSITE_URL=$(get_output WebsiteUrl)

          echo "image_url=$IMAGE_URL"       >> $GITHUB_OUTPUT
          echo "summary_url=$SUMMARY_URL"   >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME"   >> $GITHUB_OUTPUT
          echo "website_url=$WEBSITE_URL"   >> $GITHUB_OUTPUT

          echo "Image URL:   $IMAGE_URL"
          echo "Summary URL: $SUMMARY_URL"
          echo "Website URL: $WEBSITE_URL"
          echo "Bucket:      $BUCKET_NAME"

      # ── 9. Inject Lambda URLs into HTML ──────────────────────────────────
      - name: Inject Lambda URLs into frontend/index.html
        run: |
          IMAGE_URL="${{ steps.cfn.outputs.image_url }}"
          SUMMARY_URL="${{ steps.cfn.outputs.summary_url }}"

          sed -i "s|__URL_IMAGE__|${IMAGE_URL}|g"     frontend/index.html
          sed -i "s|__URL_SUMMARY__|${SUMMARY_URL}|g" frontend/index.html

          echo "Injected IMAGE_URL:   $IMAGE_URL"
          echo "Injected SUMMARY_URL: $SUMMARY_URL"

      # ── 10. Upload frontend to S3 ─────────────────────────────────────────
      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://${{ steps.cfn.outputs.bucket_name }}/ \
            --region ${{ env.REGION }} \
            --cache-control no-cache \
            --delete

      # ── 11. Done ──────────────────────────────────────────────────────────
      - name: Print website URL
        run: |
          echo ""
          echo "================================================"
          echo "  Restaurant App deployed successfully!"
          echo "  ${{ steps.cfn.outputs.website_url }}"
          echo "================================================"
