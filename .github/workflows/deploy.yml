name: Deploy Restaurant App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Package
        env:
          DEPLOY_BUCKET: ${{ secrets.SAM_DEPLOY_BUCKET }}
        run: |
          sam package \
            --s3-bucket "$DEPLOY_BUCKET" \
            --s3-prefix restaurant-app \
            --region ap-southeast-2 \
            --output-template-file packaged.yaml

      - name: Wait for stack to be ready
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name restaurant-app \
            --region ap-southeast-2 \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Current stack status: $STATUS"

          # If stack is mid-operation, wait for it to finish
          if [[ "$STATUS" == *"IN_PROGRESS"* ]]; then
            echo "Stack is in progress, waiting up to 10 minutes..."
            aws cloudformation wait stack-create-complete \
              --stack-name restaurant-app \
              --region ap-southeast-2 2>/dev/null || true
            aws cloudformation wait stack-update-complete \
              --stack-name restaurant-app \
              --region ap-southeast-2 2>/dev/null || true
          fi

          # Re-check status after waiting
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name restaurant-app \
            --region ap-southeast-2 \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Stack status after wait: $STATUS"

          # Delete the stack if it is in an unrecoverable failed state
          if [[ "$STATUS" == "ROLLBACK_COMPLETE" || "$STATUS" == "ROLLBACK_FAILED" || "$STATUS" == "CREATE_FAILED" || "$STATUS" == "DELETE_FAILED" ]]; then
            echo "Stack is in failed state ($STATUS). Deleting and waiting..."
            aws cloudformation delete-stack \
              --stack-name restaurant-app \
              --region ap-southeast-2
            aws cloudformation wait stack-delete-complete \
              --stack-name restaurant-app \
              --region ap-southeast-2
            echo "Stack deleted. Deploy will create a fresh stack."
          fi

      - name: CloudFormation Deploy
        run: |
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name restaurant-app \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-2 \
            --no-fail-on-empty-changeset

      - name: Read CloudFormation outputs
        id: cfn
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name restaurant-app \
              --region ap-southeast-2 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          IMAGE_URL=$(get_output ImageUrl)
          SUMMARY_URL=$(get_output SummaryUrl)
          BUCKET_NAME=$(get_output BucketName)
          WEBSITE_URL=$(get_output WebsiteUrl)
          echo "image_url=$IMAGE_URL"     >> $GITHUB_OUTPUT
          echo "summary_url=$SUMMARY_URL" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "website_url=$WEBSITE_URL" >> $GITHUB_OUTPUT
          echo "Image URL:   $IMAGE_URL"
          echo "Summary URL: $SUMMARY_URL"
          echo "Website URL: $WEBSITE_URL"
          echo "Bucket:      $BUCKET_NAME"

      - name: Inject Lambda URLs into frontend/index.html
        run: |
          IMAGE_URL="${{ steps.cfn.outputs.image_url }}"
          SUMMARY_URL="${{ steps.cfn.outputs.summary_url }}"
          sed -i "s|__URL_IMAGE__|${IMAGE_URL}|g"     frontend/index.html
          sed -i "s|__URL_SUMMARY__|${SUMMARY_URL}|g" frontend/index.html
          echo "Injected IMAGE_URL:   $IMAGE_URL"
          echo "Injected SUMMARY_URL: $SUMMARY_URL"

      - name: Deploy frontend to S3
        env:
          BUCKET_NAME: ${{ steps.cfn.outputs.bucket_name }}
        run: |
          aws s3 sync frontend/ "s3://$BUCKET_NAME/" \
            --region ap-southeast-2 \
            --cache-control no-cache \
            --delete

      - name: Print website URL
        run: |
          echo "================================================"
          echo "  Restaurant App deployed!"
          echo "  ${{ steps.cfn.outputs.website_url }}"
          echo "================================================"
