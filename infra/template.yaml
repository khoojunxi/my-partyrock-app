AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Restaurant Menu AI — Lambda + S3 static site

# ────────────────────────────────────────────
#  Globals
# ────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures:
      - x86_64
    Layers:
      - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
        AWS_LWA_INVOKE_MODE: response_stream
        PORT: "8080"
        BEDROCK_REGION: !Sub "${AWS::Region}"

# ────────────────────────────────────────────
#  Resources
# ────────────────────────────────────────────
Resources:

  # ── IAM Role shared by all Lambdas ──────────
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: restaurant-app-bedrock-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeBedrockModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Global cross-region inference profile (routes ap-southeast-2 / us-east-2 / us-west-2)
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:*:*:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0"
                  # Wildcard catch-all for any region the global profile may route to
                  - "arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"

  # ── Image Lambda ─────────────────────────────
  ImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: restaurant-app-image
      Description: "Streams AI image/menu descriptions via Bedrock Claude Haiku"
      CodeUri: ../lambdas/image/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── Summary Lambda ────────────────────────────
  SummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: restaurant-app-summary
      Description: "Streams AI document summaries via Bedrock Claude Haiku"
      CodeUri: ../lambdas/summary/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── S3 Static Website Bucket ──────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "restaurant-app-frontend-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

# ────────────────────────────────────────────
#  Outputs
# ────────────────────────────────────────────
Outputs:
  ImageUrl:
    Description: "Function URL for the Image Lambda"
    Value: !GetAtt ImageFunctionUrl.FunctionUrl

  SummaryUrl:
    Description: "Function URL for the Summary Lambda"
    Value: !GetAtt SummaryFunctionUrl.FunctionUrl

  WebsiteUrl:
    Description: "S3 static website URL"
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Description: "S3 bucket name for the frontend"
    Value: !Ref FrontendBucket
